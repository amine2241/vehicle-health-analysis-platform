
name: Vehicle Health Platform CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  telemetry-service:
    name: Test Telemetry Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: telemetry-service
        run: ./mvnw --batch-mode clean verify

  vehicle-analysis-service:
    name: Test Vehicle Analysis Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: vehicle-analysis-service
        run: ./mvnw --batch-mode clean verify
