# I hardcoded the credentials here to make it easier to clone and run the project.
# In a production environment, I would store them in environment variables or a secrets manager.
spring.application.name=telemetry-service

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5433/telemetrydb

spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
