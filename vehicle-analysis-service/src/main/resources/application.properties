# I hardcoded the credentials here to make it easier to clone and run the project.
# In a production environment, I would store them in environment variables or a secrets manager.
spring.application.name=vehicle-analysis-service

server.port=8082

spring.datasource.url=jdbc:postgresql://localhost:5434/analysisdb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true